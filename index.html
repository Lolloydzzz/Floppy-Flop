<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
<canvas id="game" width="400" height="600"></canvas>
<div id="menu">
<h1>Flappy Squad</h1>
<p id="lastScore" hidden></p>
<input id="username" type="text" maxlength="12" placeholder="Enter username" autocomplete="off">
<p class="label">Pick your character</p>
<div id="skinGrid"></div>
<div id="skinInfo"></div>
<button id="playBtn">Play</button>
<p class="label">Leaderboard</p>
<ol id="board"></ol>
</div>
</div>
<p class="hint">Space / click / tap = flap &nbsp;|&nbsp; E or tap the bottom bar = ability</p>
<script src="skins.js"></script>
<script src="game.js?v=2"></script>
</body>
</html>
