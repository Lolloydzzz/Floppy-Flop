<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Floppy Flop</title>
<meta name="theme-color" content="#1d2b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Floppy Flop">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="social.css?v=1">
<link rel="stylesheet" href="social2.css?v=2">
<link rel="stylesheet" href="extras.css?v=2">
<link rel="stylesheet" href="theme.css?v=1">
</head>
<script>
/* Chat: plain read of the chat node (no orderBy / limitToLast). */
(function () {
  if (window.__chatFix2) return;
  window.__chatFix2 = true;

  function tok() {
    var u = Social.user;
    if (!u) return Promise.reject(new Error("not logged in"));
    if (u.idToken && Date.now() < (u.expires || 0) - 5000) return Promise.resolve(u.idToken);
    return token();
  }

  function get(path) {
    return tok().then(function (t) {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 8000);
      var url = DB_URL + "/" + path + ".json?auth=" + encodeURIComponent(t);
      return fetch(url, { method: "GET", signal: ctrl.signal })
        .then(function (r) {
          clearTimeout(timer);
          return r.text().then(function (x) {
            console.log("[chat2] " + path + " -> " + r.status);
            if (!r.ok) throw new Error("HTTP " + r.status + " " + x.slice(0, 150));
            return x ? JSON.parse(x) : null;
          });
        })
        .catch(function (e) {
          clearTimeout(timer);
          throw (e && e.name === "AbortError") ? new Error("no answer after 8s") : e;
        });
    });
  }

  window.loadMessages = function (first) {
    clearTimeout(Soc2.chatWatch);            // stop the old 12s watchdog from hiding errors
    var them = Soc2.chatWith;
    if (!them || !Social.user) return;
    var me = Social.user.uid;
    var cid = [me, them].sort().join("_");
    var log = document.getElementById("chatLog");

    get("chats/" + cid + "/messages").then(function (data) {
      if (Soc2.chatWith !== them) return;
      data = data || {};
      var keys = Object.keys(data).sort().slice(-60);
      var sig = keys.length + ":" + (keys[keys.length - 1] || "");
      if (sig === Soc2.chatSig) return;
      Soc2.chatSig = sig;
      if (!keys.length) {
        log.replaceChildren(empty("Say hi! (plain read works)"));
        return;
      }
      log.replaceChildren.apply(log, keys.map(function (k) {
        var m = data[k], mine = m.from === me;
        return el("div", { className: "bub " + (mine ? "mine" : "theirs") },
          el("span", { textContent: m.text }),
          el("small", { textContent: timeText(m.t) }));
      }));
      log.scrollTop = log.scrollHeight;
    }).catch(function (e) {
      if (Soc2.chatWith !== them) return;
      var retry = el("button", { className: "mini", textContent: "Retry" });
      retry.onclick = function () { Soc2.chatSig = ""; window.loadMessages(true); };
      log.replaceChildren(empty("Couldn't load messages: " + (e && e.message ? e.message : e)), retry);
    });
  };
})();
</script>
<body>
<div id="stage">
<canvas id="game" width="400" height="600"></canvas>
<div id="menu">
<h1>Floppy Flop</h1>
<p id="online" style="margin:0 0 8px;font-size:13px;color:#8fe3a0;"></p>
<p id="lastScore" hidden></p>
<input id="username" type="text" maxlength="12" placeholder="Enter username" autocomplete="off">
<p class="label">Pick your skill</p>
<div id="skinGrid"></div>
<div id="skinInfo"></div>
<button id="playBtn">Play</button>
<p class="label">Leaderboard</p>
<ol id="board"></ol>
</div>
</div>
<p class="hint">Space / click / tap = flap &nbsp;|&nbsp; E or tap the bottom bar = ability</p>
<script src="skins.js?v=2"></script>
<script src="avatars.js"></script>
<script src="game.js?v=9"></script>
<script src="social.js?v=5"></script>
<script src="social2.js?v=3"></script>
<script src="admin.js?v=4"></script>
<script src="extras.js?v=2"></script>
<script src="groups.js?v=2"></script>
<script src="robot.js?v=1"></script>
<script src="extras2.js?v=5"></script>
<script src="anticheat.js?v=1"></script>
<script src="acct-guard.js?v=1"></script>
<script src="chat-fix.js?v=1"></script>
<script>
// stop double-tap and pinch zoom on phones (the game itself flaps on pointerdown, so it is not affected)
document.addEventListener("dblclick", e => e.preventDefault());
["gesturestart", "gesturechange", "gestureend"].forEach(n => document.addEventListener(n, e => e.preventDefault()));
let lastTap = 0;
document.addEventListener("touchend", e => {
  if (e.target.closest && e.target.closest("canvas")) {
    const now = Date.now();
    if (now - lastTap < 350) e.preventDefault();
    lastTap = now;
  }
}, { passive: false });
</script>
</body>
</html>
